
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Expense Tracker</h1>
            <p>Manage your income and expenses easily</p>
        </header>

        <!-- Monthly Dashboard -->
        <section class="dashboard">
            <div class="summary income">
                <h3>Monthly Income</h3>
                <h2 id="totalIncome">₹0</h2>
            </div>

            <div class="summary expense">
                <h3>Monthly Expenses</h3>
                <h2 id="totalExpense">₹0</h2>
            </div>

            <div class="summary balance">
                <h3>Monthly Balance</h3>
                <h2 id="balance">₹0</h2>
            </div>
        </section>

        <!-- Month Selection -->
        <section class="month-section">
            <label for="monthFilter">Select Month:</label>
            <input type="month" id="monthFilter">
        </section>

        <!-- Transaction Form -->
        <section class="form-section">
            <h2 id="formHeading">Add Transaction</h2>

            <form id="transactionForm">
                <input type="hidden" id="transactionId">

                <div class="form-grid">
                    <div>
                        <label for="title">Title</label>
                        <input type="text" id="title"
                            placeholder="Enter transaction name" required>
                    </div>

                    <div>
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount"
                            placeholder="Enter amount" min="0.01"
                            step="0.01" required>
                    </div>

                    <div>
                        <label for="type">Transaction Type</label>
                        <select id="type" required>
                            <option value="Income">Income</option>
                            <option value="Expense">Expense</option>
                        </select>
                    </div>

                    <div>
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="Salary">Salary</option>
                            <option value="Business">Business</option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Education">Education</option>
                            <option value="Health">Health</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div>
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>

                <div class="form-buttons">
                    <button type="submit" id="saveButton">Add Transaction</button>
                    <button type="button" id="cancelButton"
                        class="cancel-btn" hidden>Cancel Edit</button>
                </div>
            </form>
        </section>

        <!-- Transaction List -->
        <section class="list-section">
            <div class="list-heading">
                <h2>Transaction History</h2>

                <div>
                    <label for="categoryFilter">Filter:</label>
                    <select id="categoryFilter">
                        <option value="All">All Categories</option>
                        <option value="Salary">Salary</option>
                        <option value="Business">Business</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Education">Education</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div id="transactionList">
                <p class="empty-message">Loading transactions...</p>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
