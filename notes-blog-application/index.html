
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>My Notes</h1>
            <p>Your personal space to save ideas and notes</p>
        </header>

        <!-- Authentication Section -->
        <section id="authSection">

            <div class="auth-card">

                <div class="auth-tabs">
                    <button id="loginTab" class="active">Login</button>
                    <button id="signupTab">Signup</button>
                </div>

                <!-- Login Form -->
                <form id="loginForm">
                    <h2>Welcome Back!</h2>

                    <label>Email</label>
                    <input type="email" id="loginEmail"
                        placeholder="Enter email" required>

                    <label>Password</label>
                    <input type="password" id="loginPassword"
                        placeholder="Enter password" required>

                    <button type="submit">Login</button>
                </form>

                <!-- Signup Form -->
                <form id="signupForm" hidden>
                    <h2>Create Account</h2>

                    <label>Name</label>
                    <input type="text" id="signupName"
                        placeholder="Enter name" required>

                    <label>Email</label>
                    <input type="email" id="signupEmail"
                        placeholder="Enter email" required>

                    <label>Password</label>
                    <input type="password" id="signupPassword"
                        placeholder="Minimum 6 characters" required>

                    <button type="submit">Signup</button>
                </form>

                <p id="authMessage"></p>

            </div>
        </section>

        <!-- Notes Section -->
        <section id="notesSection" hidden>

            <div class="welcome">
                <h2>Welcome, <span id="userName"></span>!</h2>
                <button id="logoutButton">Logout</button>
            </div>

            <div class="note-form">
                <h2 id="formHeading">Create New Note</h2>

                <form id="noteForm">

                    <input type="hidden" id="noteId">

                    <label>Note Title</label>
                    <input type="text" id="noteTitle"
                        placeholder="Enter note title" required>

                    <label>Note Content</label>
                    <textarea id="noteContent"
                        placeholder="Write your note here..."
                        required></textarea>

                    <button type="submit" id="saveButton">
                        Save Note
                    </button>

                    <button type="button" id="cancelButton" hidden>
                        Cancel Edit
                    </button>

                </form>
            </div>

            <h2 class="notes-heading">My Notes</h2>

            <div id="notesList">
                <p>No notes available.</p>
            </div>

        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
