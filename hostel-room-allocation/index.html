
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Room Allocation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Hostel Room Allocation</h1>
            <p>Manage rooms and student allocations</p>
        </header>

        <!-- Dashboard -->
        <section class="dashboard">

            <div class="card">
                <h3>Total Rooms</h3>
                <h2 id="totalRooms">0</h2>
            </div>

            <div class="card">
                <h3>Occupied Beds</h3>
                <h2 id="occupiedBeds">0</h2>
            </div>

            <div class="card">
                <h3>Vacant Beds</h3>
                <h2 id="vacantBeds">0</h2>
            </div>

        </section>

        <!-- Add Room -->
        <section class="form-section">
            <h2>Add New Room</h2>

            <form id="roomForm">

                <label>Room Number</label>
                <input type="text" id="roomNumber"
                    placeholder="Example: A101" required>

                <label>Room Capacity</label>
                <input type="number" id="capacity"
                    min="1" placeholder="Enter capacity" required>

                <label>Room Type</label>
                <select id="roomType" required>
                    <option value="">Select Room Type</option>
                    <option value="Single">Single</option>
                    <option value="Double">Double</option>
                    <option value="Triple">Triple</option>
                    <option value="Dormitory">Dormitory</option>
                </select>

                <button type="submit">Add Room</button>

            </form>
        </section>

        <!-- Allocate Student -->
        <section class="form-section">
            <h2>Allocate Student</h2>

            <form id="studentForm">

                <label>Student Name</label>
                <input type="text" id="studentName"
                    placeholder="Enter student name" required>

                <label>Student Email</label>
                <input type="email" id="studentEmail"
                    placeholder="Enter student email" required>

                <label>Select Room</label>
                <select id="studentRoom" required>
                    <option value="">Select Available Room</option>
                </select>

                <button type="submit">Allocate Room</button>

            </form>
        </section>

        <!-- Room List -->
        <section class="list-section">
            <h2>Room Occupancy Details</h2>

            <div id="roomList">
                <p>Loading rooms...</p>
            </div>
        </section>

        <!-- Student List -->
        <section class="list-section">
            <h2>Allocated Students</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Email</th>
                            <th>Room Number</th>
                            <th>Room Type</th>
                        </tr>
                    </thead>

                    <tbody id="studentList">
                        <tr>
                            <td colspan="4">Loading students...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>
</body>
</html>
