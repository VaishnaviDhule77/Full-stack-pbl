
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Event Registration Portal</h1>
            <p>Register now and be part of our exciting events!</p>
        </header>

        <div class="registration-card">
            <h2>Participant Registration</h2>

            <form id="registrationForm">

                <label for="name">Full Name</label>
                <input type="text" id="name"
                    placeholder="Enter your full name" required>
                <small id="nameError"></small>

                <label for="email">Email Address</label>
                <input type="email" id="email"
                    placeholder="Enter your email" required>
                <small id="emailError"></small>

                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile"
                    placeholder="Enter 10-digit mobile number"
                    maxlength="10" required>
                <small id="mobileError"></small>

                <label for="event">Select Event</label>
                <select id="event" required>
                    <option value="">-- Select an Event --</option>
                    <option value="Web Development Workshop">
                        Web Development Workshop
                    </option>
                    <option value="AI and Machine Learning Seminar">
                        AI and Machine Learning Seminar
                    </option>
                    <option value="Cybersecurity Awareness">
                        Cybersecurity Awareness
                    </option>
                    <option value="Innovation Hackathon">
                        Innovation Hackathon
                    </option>
                </select>
                <small id="eventError"></small>

                <button type="submit" id="registerButton">
                    Register Now
                </button>

            </form>

            <p id="message"></p>

            <a href="admin.html" class="admin-link">
                Go to Admin Page
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
